<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aion 2 — Perfil completo</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0d1421;color:#f0f4ff;font:15px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:24px}a{color:#91baff}h1{font-size:26px}h2{font-size:20px;margin:0 0 16px}h3{font-size:16px;margin:14px 0 8px}.panel{background:#1a2639;border:1px solid #344761;border-radius:16px;padding:18px;margin:16px 0}.hero{display:flex;align-items:center;gap:20px;flex-wrap:wrap}.avatar{width:100px;height:100px;object-fit:cover;border-radius:12px;background:#263448}.muted{color:#afbed1}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px}.stat{background:#111c2c;padding:12px;border-radius:10px}.stat b{display:block;font-size:20px}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.tabs button{border:1px solid #506381;border-radius:9px;padding:10px 14px;background:#1b2a40;color:#fff;cursor:pointer}.tabs button[aria-selected=true]{background:#346be0}.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:10px}.item{display:flex;align-items:center;gap:12px;padding:10px;background:#111c2c;border-radius:10px;min-height:74px}.item img{width:48px;height:48px;object-fit:contain;flex-shrink:0}.item strong{display:block;overflow-wrap:anywhere}.item small{display:block;color:#b8c6d8;margin-top:4px}.section{display:none}.section.active{display:block}.progress{height:8px;border-radius:10px;background:#35455c;overflow:hidden;margin:8px 0}.progress>div{height:100%;background:#4c88f6}.badge{color:#d7b4ff}.empty{color:#b8c6d8}#error{color:#ffb7b7;white-space:pre-wrap}input,button{font:inherit}
</style></head><body><main><p><a href="/search.html">← Voltar à busca</a> · <a href="/maps.html">🗺️ Mapa de farm</a></p><h1>Perfil completo do personagem</h1><div id="status" class="panel">Carregando dados oficiais…</div><div id="content" hidden><section class="panel hero"><img id="avatar" class="avatar" alt="Imagem do personagem"><div><h1 id="name"></h1><p id="identity" class="muted"></p><div class="stats"><div class="stat"><span>Poder de combate</span><b id="power"></b></div><div class="stat"><span>Item Level</span><b id="ilevel"></b></div></div></div></section><nav class="tabs" aria-label="Seções do personagem"></nav><div id="sections"></div></div><p id="error"></p><section class="panel"><h2>Teste de acesso direto à NCSOFT</h2><p class="muted">Verifica se o navegador permite consultar a API oficial a partir deste site. Não solicita login nem envia credenciais.</p><button id="test-direct" type="button" style="background:#346be0;color:white;border:0;border-radius:9px;padding:12px;cursor:pointer">Testar acesso direto</button><div id="direct-result" role="status" aria-live="polite" style="white-space:pre-wrap;margin-top:12px"></div></section></main><script>
const $=s=>document.querySelector(s),fmt=n=>Number(n||0).toLocaleString('pt-BR');
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=String(text);if(cls)e.className=cls;return e}
function item(v,sub){const e=el('div',undefined,'item');if(v.icon&&/^https:\/\/assets\.playnccdn\.com\//.test(v.icon)){const im=el('img');im.src=v.icon;im.alt='';im.loading='lazy';e.append(im)}const wrap=el('div');wrap.append(el('strong',v.name||v.slotPosName||'Item'));wrap.append(el('small',sub||''));e.append(wrap);return e}
function cards(root,list,format){const g=el('div',undefined,'items');for(const v of list||[])g.append(item(v,format(v)));root.append(g);if(!list?.length)root.append(el('p','Nenhum dado disponível.','empty'))}
function section(name){const panel=el('section',undefined,'panel section');panel.append(el('h2',name));return panel}
function title(root,text){root.append(el('h3',text))}
function progress(root,name,value,total){const p=el('div');p.append(el('strong',name+' — '+value+'/'+total));const track=el('div',undefined,'progress'),fill=el('div');fill.style.width=(total?Math.min(100,100*value/total):0)+'%';track.append(fill);p.append(track);root.append(p)}
function show(data){const info=data.info||{},eq=data.equipment||{},p=info.profile||{},st=info.stat?.statList||[];$('#name').textContent=p.characterName||'Personagem';$('#identity').textContent=[p.className,p.raceName,p.serverName,p.characterLevel&&'Nível '+p.characterLevel].filter(Boolean).join(' • ');$('#power').textContent=fmt(p.combatPower);$('#ilevel').textContent=fmt(st.find(x=>x.type==='ItemLevel')?.value);if(p.profileImage)$('#avatar').src=p.profileImage;else $('#avatar').hidden=true;
const groups=[];
const gear=section('Equipamentos');cards(gear,eq.equipment?.equipmentList,v=>[v.slotPosName,v.grade,v.enchantLevel?'+'+v.enchantLevel:''].filter(Boolean).join(' • '));groups.push(['Equipamentos',gear]);
const stats=section('Atributos');for(const s of st){const box=el('div',undefined,'stat');box.append(el('strong',s.name+' — '+fmt(s.value)));if(s.statSecondList?.length)box.append(el('small',s.statSecondList.join(' • ')));stats.append(box)}groups.push(['Atributos',stats]);
const skills=section('Habilidades');for(const category of ['Active','Passive','Dp']){title(skills,category==='Active'?'Ativas':category==='Passive'?'Passivas':'DP');cards(skills,(eq.skill?.skillList||[]).filter(v=>v.category===category),v=>'Nível '+v.skillLevel+' • '+(v.acquired?'Adquirida':'Não adquirida')+' • '+(v.equip?'Equipada':'Não equipada'))}groups.push(['Habilidades',skills]);
const daeva=section('Daevanion');for(const b of info.daevanion?.boardList||[])progress(daeva,b.name,b.openNodeCount,b.totalNodeCount);groups.push(['Daevanion',daeva]);
const titles=section('Títulos');const t=info.title||{};progress(titles,'Títulos conquistados',t.ownedCount||0,t.totalCount||0);for(const x of t.titleList||[]){title(titles,x.name);progress(titles,'Categoria '+x.equipCategory,x.ownedCount||0,x.totalCount||0);titles.append(el('p',[...(x.equipStatList||[]),...(x.statList||[])].map(y=>y.desc).join(' • '),'muted'))}groups.push(['Títulos',titles]);
const appearance=section('Aparências e companheiros');title(appearance,'Aparências');cards(appearance,eq.equipment?.skinList,v=>v.grade||'');title(appearance,'Mascote');cards(appearance,eq.petwing?.pet?[eq.petwing.pet]:[],v=>'Nível '+v.level);title(appearance,'Asas');cards(appearance,eq.petwing?.wing?[eq.petwing.wing]:[],v=>v.grade||'');title(appearance,'Aparência das asas');cards(appearance,eq.petwing?.wingSkin?[eq.petwing.wingSkin]:[],v=>v.grade||'');groups.push(['Aparências',appearance]);
const rank=section('Ranking');const rankings=info.ranking?.rankingList;if(Array.isArray(rankings)&&rankings.length){rank.append(el('pre',JSON.stringify(rankings,null,2)))}else rank.append(el('p','Nenhuma informação de ranking retornada.','empty'));groups.push(['Ranking',rank]);
for(const [i,[name,panel]] of groups.entries()){panel.classList.toggle('active',i===0);panel.id='section-'+i;$('#sections').append(panel);const btn=el('button',name);btn.type='button';btn.setAttribute('aria-selected',String(i===0));btn.onclick=()=>{document.querySelectorAll('.section').forEach((s,j)=>s.classList.toggle('active',j===i));document.querySelectorAll('.tabs button').forEach((b,j)=>b.setAttribute('aria-selected',String(j===i)))};$('.tabs').append(btn)}$('#status').hidden=true;$('#content').hidden=false}

$('#test-direct').addEventListener('click',async()=>{
 const button=$('#test-direct'),output=$('#direct-result');
 const q=new URLSearchParams(location.search),characterId=q.get('characterId'),serverId=q.get('serverId'),region=q.get('region')||'la';
 if(!characterId||!serverId){output.textContent='Identificadores ausentes na URL do perfil.';return}
 button.disabled=true;output.textContent='Testando info e equipment diretamente no navegador…';
 const params=new URLSearchParams({region,lang:'en-US',characterId,serverId});
 const responses=await Promise.all(['info','equipment'].map(async name=>{
  try{
   const url='https://aion2.plaync.com/api/character/'+name+'?'+params;
   const response=await fetch(url,{mode:'cors',credentials:'omit',headers:{Accept:'application/json'}});
   const type=response.headers.get('content-type')||'desconhecido';
   if(!response.ok)return {name,status:'HTTP '+response.status+' ('+type+')',data:null};
   if(!type.includes('json'))return {name,status:'HTTP '+response.status+' (resposta não JSON: '+type+')',data:null};
   return {name,status:'HTTP '+response.status+' — JSON recebido',data:await response.json()};
  }catch(e){return {name,status:'Falha de acesso no navegador (possível CORS ou rede): '+(e?.message||String(e)),data:null}}
 }));
 output.textContent=responses.map(r=>r.name+': '+r.status).join('\\n');
 const info=responses.find(r=>r.name==='info')?.data,equipment=responses.find(r=>r.name==='equipment')?.data;
 if(info||equipment){try{show({info:info||{},equipment:equipment||{}});$('#error').textContent='';output.textContent+='\\nDados disponíveis exibidos acima.'}catch(e){output.textContent+='\\nErro ao montar o perfil: '+e.message}}
 button.disabled=false;
});
(async()=>{const params=new URLSearchParams(location.search),characterId=params.get('characterId'),serverId=params.get('serverId'),region=params.get('region')||'la';if(!characterId||!serverId){$('#status').textContent='Personagem não identificado. Volte à busca e selecione um resultado.';return}try{const q=new URLSearchParams({characterId,serverId,region});const response=await fetch('/api/character-details?'+q);const raw=await response.text();let data;try{data=JSON.parse(raw)}catch{throw Error('Resposta inválida do servidor (HTTP '+response.status+').')}if(!response.ok)throw Error([data.error||'HTTP '+response.status,...(data.warnings||[])].filter(Boolean).join(' | '));show(data);if(data.warnings?.length){const note=el('div','Algumas informações não puderam ser carregadas: '+data.warnings.join(' | '),'panel');note.style.color='#ffb7b7';$('#content').prepend(note)}}catch(e){$('#status').textContent='Não foi possível carregar o perfil.';$('#error').textContent=e.message}})();
</script></body></html>
